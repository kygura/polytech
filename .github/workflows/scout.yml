# Heartbeat for scouting on Vercel Hobby (vercel.json crons are once-per-day there).
# The scout cron job runs kickIfStale, which starts scoutChain (sweep -> snapshot -> screen -> research -> monitor)
# when the last kick is older than 30 min; its KV lock keeps overlapping pings to one start.
# The whole app is behind the login, so both steps authenticate with the CRON_SECRET repo secret (required).
# The alert pass (monitor job) also runs on every beat; deduped server-side, so extra beats are cheap.
name: scout

# Paused: schedule off while the Supabase project is paused. To resume, restore:
#   schedule:
#     - cron: "*/30 * * * *" # ~1,440 runner-min/month, inside the 2,000 free for a private repo
on:
  workflow_dispatch:

jobs:
  kick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      SCOUT_URL: ${{ vars.SCOUT_URL }} # deployment origin, e.g. https://polytech.vercel.app
    steps:
      - name: Kick scouting
        run: |
          test -n "$SCOUT_URL" || { echo "::error::set repo variable SCOUT_URL"; exit 1; }
          test -n "$CRON_SECRET" || { echo "::error::set repo secret CRON_SECRET (same value as the deployment's CRON_SECRET, at least 32 bytes)"; exit 1; }
          curl -fsS --max-time 60 -w "\n%{http_code}\n" -H "Authorization: Bearer $CRON_SECRET" "$SCOUT_URL/api/cron/scout"
      - name: Run alert monitor
        run: |
          test -n "$SCOUT_URL" || { echo "::error::set repo variable SCOUT_URL"; exit 1; }
          test -n "$CRON_SECRET" || { echo "::error::set repo secret CRON_SECRET"; exit 1; }
          curl -fsS --max-time 60 -o /dev/null -w "%{http_code}\n" -H "Authorization: Bearer $CRON_SECRET" "$SCOUT_URL/api/cron/monitor"
